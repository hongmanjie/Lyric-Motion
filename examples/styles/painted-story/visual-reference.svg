</g><g font-family="Noto Serif SC,SimSun,serif" fill="#293b49" font-size="25"><text x="83" y="201">01　关系与空间：先看清谁在做什么</text><text x="836" y="201">02　物件特写：动作改变它的意义</text><text x="83" y="611">03　预备 → 发生 → 结果，给动作时间</text></g><text x="836" y="611" font-size="25" font-family="Noto Serif SC,SimSun,serif" fill="#f2dfb8">04　重复段落：人物作出新的选择</text><text x="80" y="983" font-size="25" font-family="Noto Serif SC,SimSun,serif" fill="#293b49">纸绘也可以有快节奏：用景别、形体展开、动作落点与衔接产生动感。</text><text x="80" y="1026" font-size="22" font-family="Noto Serif SC,SimSun,serif" fill="#62716f">材料保持统一，故事为新歌重写；实际检查接触、连续性、字幕与完整播放。</text></svg>
