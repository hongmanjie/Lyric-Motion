<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyric Motion · Exports</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px;background:#121414;color:#efeee6;font:14px system-ui}video{display:block;max-width:100%;width:min(1200px,calc((100dvh - 150px)*1.7778));max-height:calc(100dvh - 130px);background:#121414}nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap}button,select{font:inherit;padding:10px 18px;border:0;border-radius:25px;background:#efeee6;color:#121414}a{color:#d4f265}#error{color:#ffb3a8}</style><video id="film" controls playsinline preload="auto"></video><nav><button id="play">Play</button><select id="files" aria-label="Export"></select><a href="/">Live artwork</a></nav><p id="error"></p><script type="module">
const video=document.querySelector('video'),select=document.querySelector('select'),button=document.querySelector('button'),q=new URLSearchParams(location.search);
try{const data=await fetch('/__api/project').then(r=>r.json());if(!data.renders.length)throw new Error('No exports yet. Ask your agent to render the project.');for(const file of data.renders){const option=document.createElement('option');option.value=file;option.textContent=file;select.append(option);}const chosen=q.get('file');if(chosen&&data.renders.includes(chosen))select.value=chosen;function load(){video.src='/renders/'+encodeURIComponent(select.value);video.load();}select.onchange=load;if(q.has('mute'))video.muted=true;video.addEventListener('loadedmetadata',()=>{if(q.has('t'))video.currentTime=Math.min(video.duration,Math.max(0,Number(q.get('t'))||0));},{once:true});load();button.onclick=()=>video.paused?video.play():video.pause();video.onplay=()=>button.textContent='Pause';video.onpause=()=>button.textContent='Play';}catch(e){document.querySelector('#error').textContent=e.message;button.disabled=true;}
</script></html>
