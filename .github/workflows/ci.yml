name: Toolkit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Select runner Google Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome" --version
          printf 'CHROME_PATH=%s\n' "$chrome" >> "$GITHUB_ENV"
      - run: npm test
      - run: node tools/cli.mjs doctor
      - run: node tools/cli.mjs check --project examples/demo
      - run: node tools/cli.mjs render --project examples/demo --duration 2 --name ci-smoke --draft
