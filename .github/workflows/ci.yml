name: Toolkit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
      - run: node tools/cli.mjs doctor
      - run: node tools/cli.mjs check --project examples/demo
      - run: node tools/cli.mjs render --project examples/demo --duration 2 --name ci-smoke --draft
